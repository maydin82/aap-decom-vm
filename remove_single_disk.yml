---
# remove_single_disk.yml
# Included per disk (item) in the precomputed disks_to_remove list from
# process_single_vm.yml. By the time this runs, the decision to remove
# this disk has already been made (budget-checked) - this file just
# performs the actual removal.
#
# Uses vm_vcenter (resolved by process_single_vm.yml from this VM's OWN
# log record - vcenter_name/datacenter - not from vcenter_choice/vars.yml).

- name: "Remove disk: {{ item.label }}"
  community.vmware.vmware_guest_disk:
    hostname: "{{ vm_vcenter.hostname }}"
    username: "{{ vm_vcenter.username }}"
    password: "{{ vm_vcenter.password }}"
    datacenter: "{{ vm_vcenter.datacenter }}"
    validate_certs: false
    name: "{{ vm_record.server_name }}"
    disk:
      - state: absent
        controller_number: "{{ item.scsi_controller }}"
        unit_number: "{{ item.unit_number }}"
