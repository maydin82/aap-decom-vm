---
controller_credential_types:
  - name: "GIT creds"
    inputs:
      fields:
      - id: git_username
        type: string
        label: Git Username
      - id: git_token
        type: string
        label: Git Token / PAT
        secret: true
      required:
      - git_username
      - git_token
    injectors:
      extra_vars:
        git_token: !unsafe "{{ git_token }}"
        git_username: !unsafe "{{ git_username }}"

